<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5266;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1C3A47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientSecondary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6BA3A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5266;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circle Background -->
  <circle cx="100" cy="100" r="95" fill="#f0f4f8" stroke="#2E5266" stroke-width="2"/>
  
  <!-- Medical Cross (representing healthcare) -->
  <g id="medical-cross">
    <!-- Horizontal bar -->
    <rect x="60" y="85" width="80" height="30" fill="url(#gradientPrimary)" rx="4"/>
    <!-- Vertical bar -->
    <rect x="85" y="60" width="30" height="80" fill="url(#gradientPrimary)" rx="4"/>
  </g>
  
  <!-- Cooperative/People Symbol (3 circles representing unity) -->
  <g id="people-unity" opacity="0.9">
    <!-- Left circle -->
    <circle cx="60" cy="140" r="12" fill="#6BA3A3"/>
    <!-- Center circle -->
    <circle cx="100" cy="135" r="14" fill="#2E5266"/>
    <!-- Right circle -->
    <circle cx="140" cy="140" r="12" fill="#6BA3A3"/>
    <!-- Connection lines -->
    <line x1="72" y1="145" x2="88" y2="142" stroke="#6BA3A3" stroke-width="2"/>
    <line x1="112" y1="142" x2="128" y2="145" stroke="#6BA3A3" stroke-width="2"/>
  </g>
  
  <!-- Melati Flower (Jasmine - 5 petals) -->
  <g id="melati-flower" transform="translate(100, 60)">
    <!-- Center -->
    <circle cx="0" cy="0" r="6" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    <!-- Top petal -->
    <ellipse cx="0" cy="-18" rx="7" ry="12" fill="#FFF8DC" stroke="#FFD700" stroke-width="1.5"/>
    <!-- Right-top petal -->
    <ellipse cx="17" cy="-9" rx="7" ry="12" fill="#FFF8DC" stroke="#FFD700" stroke-width="1.5" transform="rotate(72 17 -9)"/>
    <!-- Right-bottom petal -->
    <ellipse cx="10" cy="15" rx="7" ry="12" fill="#FFF8DC" stroke="#FFD700" stroke-width="1.5" transform="rotate(144 10 15)"/>
    <!-- Left-bottom petal -->
    <ellipse cx="-10" cy="15" rx="7" ry="12" fill="#FFF8DC" stroke="#FFD700" stroke-width="1.5" transform="rotate(-144 -10 15)"/>
    <!-- Left-top petal -->
    <ellipse cx="-17" cy="-9" rx="7" ry="12" fill="#FFF8DC" stroke="#FFD700" stroke-width="1.5" transform="rotate(-72 -17 -9)"/>
  </g>
  
  <!-- Shield/Protection Symbol -->
  <g id="shield" opacity="0.85">
    <path d="M 100 40 L 130 55 L 130 85 Q 100 115 100 115 Q 100 115 70 85 L 70 55 Z" 
          fill="none" stroke="#2E5266" stroke-width="2" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Area (for organization name if needed) -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
        text-anchor="middle" fill="#2E5266" opacity="0.7">
    KOPERASI KONSUMEN
  </text>
</svg>
